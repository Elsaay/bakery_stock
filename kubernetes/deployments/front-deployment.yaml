apiVersion: apps/v1
kind: Deployment
metadata:
  name: front-deployment
  labels:
    app: front
spec:
  replicas: 1
  selector:
    matchLabels:
      app: front
  template:
    metadata:
      labels:
        app: front
    spec:
      containers:
      - name: front
        image: yannisal/bakery-front:latest
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: REACT_APP_PRODUCTS_URL
          value: "http://NODE_IP:30001"
        - name: REACT_APP_ORDERS_URL
          value: "http://NODE_IP:30002"
        - name: REACT_APP_STOCK_URL
          value: "http://NODE_IP:30003"
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
