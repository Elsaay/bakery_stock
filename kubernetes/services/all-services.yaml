apiVersion: v1
kind: Service
metadata:
  name: frontend-service
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
---
apiVersion: v1
kind: Service
metadata:
  name: backend-products-service
spec:
  selector:
    app: backend-products
  ports:
    - port: 5001
      targetPort: 5001
---
apiVersion: v1
kind: Service
metadata:
  name: backend-orders-service
spec:
  selector:
    app: backend-orders
  ports:
    - port: 5002
      targetPort: 5002
---
apiVersion: v1
kind: Service
metadata:
  name: backend-stock-usage-service
spec:
  selector:
    app: backend-stock-usage
  ports:
    - port: 5003
      targetPort: 5003
