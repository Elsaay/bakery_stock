apiVersion: v1
kind: Service
metadata:
  name: products-service
  labels:
    app: products
spec:
  type: NodePort
  selector:
    app: products
  ports:
  - port: 5001
    targetPort: 5001
    nodePort: 30001
    protocol: TCP
